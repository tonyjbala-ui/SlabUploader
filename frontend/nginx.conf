# Serve adapter-static build and proxy /api → FastAPI on the compose network.
# Prod with Caddy: Caddy already routes /api to fastapi; this proxy still helps
# local compose when browsing FRONTEND_PORT alone (thin UI on one port).

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	client_max_body_size 50m;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	location /api/ {
		proxy_pass http://fastapi:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
	}

	# Exact /api (no trailing slash) — same upstream, full URI preserved.
	location = /api {
		proxy_pass http://fastapi:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ $uri.html /index.html;
	}
}